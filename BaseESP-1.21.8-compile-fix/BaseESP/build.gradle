plugins { id 'fabric-loom' version '1.11-SNAPSHOT' }
version = '1.0.0'
group = 'dev.baseesp'
base { archivesName = 'baseesp' }
repositories { maven { url = 'https://maven.fabricmc.net/' }; mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.8'
 mappings 'net.fabricmc:yarn:1.21.8+build.1:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.17.2'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.129.0+1.21.8'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
