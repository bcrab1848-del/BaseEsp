
name: Build BaseESP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find project and compile
        shell: bash
        run: |
          PROJECT=$(find . -name build.gradle -not -path '*/.gradle/*' -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: build.gradle not found!"
            exit 1
          fi
          cd "$(dirname "$PROJECT")"
          gradle build

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: BaseESP-1.21.8
          path: '**/build/libs/*.jar'
